# =====================================================================
# GoldBot - configuracion para EUR/USD
# =====================================================================
# Las credenciales NUNCA van aqui. Se leen de variables de entorno:
#   GOLDBOT_API_KEY, GOLDBOT_API_SECRET
#   GOLDBOT_MT5_LOGIN, GOLDBOT_MT5_PASSWORD, GOLDBOT_MT5_SERVER
# =====================================================================

log_level: INFO
log_file: logs/eurusd.log
db_path: data/eurusd.db
artifacts_dir: artifacts/eurusd

# ---------------------------------------------------------------------
# Datos
# ---------------------------------------------------------------------
data:
  symbol: EURUSD
  # Instrumento logico: XAUUSD (oro) o EURUSD. Vacio = se deduce del
  # simbolo. Determina tamano de contrato, costes y rango de precios valido.
  instrument: EURUSD
  timeframe: 5m
  timeframe_minutes: 5

  # Orden de preferencia. El primero que devuelva velas gana.
  #   yfinance -> futuros COMEX GC=F (gratis, pero solo ~60 dias de M5)
  #   ccxt     -> PAXG/USDT (oro tokenizado, permite paginar anos de M5)
  #   csv      -> export propio de MetaTrader 5 (la mejor calidad)
  providers: [yfinance, ccxt, csv]

  yfinance_symbol: "EURUSD=X"
  yfinance_fallback: "EUR=X"
  ccxt_exchange: binance
  ccxt_symbol: "EUR/USDT"
  csv_path: data/EURUSD_M5.csv

  cache_dir: data/cache_eurusd
  history_days: 720          # objetivo; el cache lo va acumulando dia a dia
  min_bars_required: 5000    # por debajo no se entrena con datos reales
  max_gap_minutes: 120

  # Arranque desde MT5: al conectar con el broker (XM, Vantage...) lo
  # primero es volcar estas velas reales del instrumento a operar. Son
  # mejores que cualquier proxy: mismo spread, horario y mercado.
  mt5_bootstrap_bars: 5000
  mt5_bootstrap_on_connect: true
  mt5_symbol: ""             # vacio = autodeteccion (EURUSD, EURUSD+, EURUSD.a...)

# ---------------------------------------------------------------------
# Costes de transaccion (¡ajustalos a los de TU broker!)
# ---------------------------------------------------------------------
# Son la diferencia entre un backtest bonito y uno honesto. En M5 el
# movimiento esperado es del orden del spread: si te quedas corto aqui,
# toda estrategia parecera rentable.
costs:
  # EUR/USD cotiza a 5 decimales: 1 pip = 0.0001.
  spread_points: 0.00010     # ~1 pip, tipico en cuenta estandar XM/Vantage
  commission_per_lot: 0.0    # las cuentas estandar no cobran comision aparte
  slippage_points: 0.00002
  contract_size: 100000.0    # euros por lote estandar (NO tocar: es del mercado)
  swap_long: -0.8
  swap_short: 0.1

# ---------------------------------------------------------------------
# Riesgo. Estos limites no se negocian en tiempo de ejecucion.
# ---------------------------------------------------------------------
risk:
  initial_balance: 10000.0
  risk_per_trade: 0.005      # 0.5% del capital por operacion
  max_risk_per_trade: 0.02
  max_concurrent_positions: 1
  max_daily_loss_pct: 0.03   # el bot corta el dia al -3%
  max_drawdown_pct: 0.15     # el bot se apaga al -15%
  max_lot_size: 5.0
  min_lot_size: 0.01
  lot_step: 0.01
  use_kelly: true
  kelly_fraction: 0.25       # Kelly fraccional; nunca Kelly completo
  atr_stop_multiplier: 2.0
  atr_target_multiplier: 3.0
  max_trades_per_day: 20
  cooldown_bars_after_loss: 3

# ---------------------------------------------------------------------
# Algoritmo genetico (el que inventa las estrategias)
# ---------------------------------------------------------------------
evolution:
  population_size: 120
  generations: 40
  crossover_prob: 0.6
  mutation_prob: 0.35
  tournament_size: 4
  elitism: 6
  hall_of_fame: 25
  max_conditions: 4          # complejidad maxima de una regla
  random_seed: 42            # null = no determinista
  n_jobs: -1
  early_stop_generations: 12
  min_trades: 40             # menos operaciones = muestra sin valor

# ---------------------------------------------------------------------
# Refinamiento bayesiano
# ---------------------------------------------------------------------
optuna:
  enabled: true
  n_trials: 80
  timeout_seconds: 900
  n_startup_trials: 15
  pruner_warmup_steps: 5

# ---------------------------------------------------------------------
# Meta-etiquetado (filtro de calidad de senales)
# ---------------------------------------------------------------------
ml:
  enabled: true
  model_type: gradient_boosting   # gradient_boosting | random_forest | logistic | mlp | torch_mlp
  lookahead_bars: 24              # 2 horas en M5
  profit_take_atr: 1.5
  stop_loss_atr: 1.0
  min_probability: 0.55
  train_test_split: 0.75
  purge_bars: 24                  # purga entre train y test
  embargo_bars: 12
  max_features: 40
  retrain_every_days: 1
  min_auc: 0.52                   # por debajo, el modelo no se usa

# ---------------------------------------------------------------------
# Validacion
# ---------------------------------------------------------------------
backtest:
  walk_forward_folds: 6
  train_ratio: 0.7
  purge_bars: 24
  monte_carlo_runs: 500
  monte_carlo_confidence: 0.95
  min_oos_ratio: 0.45             # rendimiento OOS / IS minimo

# ---------------------------------------------------------------------
# Puerta de estabilidad: solo lo que pasa esto opera con dinero
# ---------------------------------------------------------------------
stability:
  min_sharpe: 1.0
  min_profit_factor: 1.15
  max_drawdown_pct: 0.20
  min_trades: 50
  min_win_rate: 0.35
  min_folds_profitable: 0.65      # % de tramos walk-forward en verde
  max_return_std_across_folds: 2.5
  incubation_days: 10             # dias en papel antes de tocar dinero real
  incubation_min_trades: 25
  degradation_sharpe_drop: 0.5
  consecutive_bad_days: 5

# ---------------------------------------------------------------------
# Filtro de tendencia: PROHIBICION de entrar en contra
# ---------------------------------------------------------------------
# Es una restriccion estructural, no una condicion mas del genoma. Se
# aplica fuera del arbol genetico precisamente para que la evolucion no
# pueda desactivarla: si fuese una regla mas, el optimizador la eliminaria
# en cuanto encontrase un tramo del historico donde ir a contracorriente
# rentase mas, y ese tramo siempre existe.
trend:
  enabled: true
  method: combined         # ema_stack | ema_slope | structure | combined
  fast_ema: 50             # ~4 horas en M5
  mid_ema: 200             # ~17 horas
  slow_ema: 576            # 2 dias de negociacion
  min_slope: 0.000002   # el euro se mueve menos que el oro
  allow_flat: false        # false = tampoco se opera en lateral
  swing_left: 3
  swing_right: 3

# ---------------------------------------------------------------------
# Smart Money Concepts
# ---------------------------------------------------------------------
# Estructura (BOS/CHoCH), order blocks, desequilibrios (FVG) y toma de
# liquidez. Los swings se confirman con `swing_right` velas de retraso:
# marcarlos en su propia vela introduce look-ahead.
smc:
  enabled: true
  swing_left: 3
  swing_right: 3
  equal_level_tolerance_atr: 0.25
  sweep_min_penetration: 0.0

# ---------------------------------------------------------------------
# Telegram: avisos y control remoto
# ---------------------------------------------------------------------
# El token NUNCA va aqui. Se lee de GOLDBOT_TELEGRAM_TOKEN.
# Para obtenerlo: habla con @BotFather, crea un bot y copia el token.
# Para el chat_id: escribe a tu bot y visita
#   https://api.telegram.org/bot<TOKEN>/getUpdates
telegram:
  enabled: false
  chat_id: ""              # o GOLDBOT_TELEGRAM_CHAT_ID
  notify_trades: true
  notify_daily_report: true
  notify_errors: true
  allow_remote_control: true   # /pausar, /cerrartodo, /parar
  poll_interval_seconds: 3.0

# ---------------------------------------------------------------------
# Ejecucion
# ---------------------------------------------------------------------
execution:
  mode: paper                # paper | ccxt | mt5
  exchange: binance
  symbol: "EUR/USDT"
  testnet: true
  mt5_symbol: EURUSD
  mt5_magic: 20250726
  order_type: market
  max_slippage_pct: 0.002
  retry_attempts: 3
  retry_backoff_seconds: 2.0

  # SALVAGUARDA PRINCIPAL. Con true jamas se envia una orden real.
  # Ponlo a false solo cuando el bot lleve semanas incubando bien.
  dry_run: true

# ---------------------------------------------------------------------
# Autonomia: el ciclo diario
# ---------------------------------------------------------------------
autonomy:
  daily_learning_hour_utc: 22     # tras el cierre de Nueva York
  discovery_every_days: 3         # cada cuanto se lanza la evolucion completa
  keep_top_strategies: 10
  challenger_slots: 3
  promote_min_improvement: 0.15   # el retador debe superar al campeon un 15%
  auto_promote: true
  auto_demote: true
  max_runtime_minutes: 120
