[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldbot"
version = "1.0.0"
description = "Bot autonomo de trading de oro (XAU/USD) en temporalidad M5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "scikit-learn>=1.4",
    "optuna>=3.5",
    "deap>=1.4",
    "yfinance>=0.2.40",
    "ccxt>=4.2",
    "requests>=2.31",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]

[project.scripts]
goldbot = "goldbot.cli:main"

[tool.setuptools.packages.find]
include = ["goldbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: pruebas lentas (evolucion completa); desactivar con -m 'not slow'",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # la longitud la controla el formateador
    "B008",   # llamadas en argumentos por defecto (patron habitual en dataclasses)
    "SIM108", # el operador ternario no siempre es mas legible
    # En el motor de backtest y el runner, los `if` anidados separan etapas
    # distintas del ciclo de vida de una posicion y llevan comentarios entre
    # medias. Fusionarlos con `and` ahorra una linea y cuesta la explicacion de
    # por que existe cada comprobacion, que es justo lo que hay que poder
    # auditar cuando algo va mal con dinero real.
    "SIM102",
    # `try/except/pass` con comentario explicito es mas claro aqui que
    # contextlib.suppress, que oculta que se esta ignorando el error a proposito.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
